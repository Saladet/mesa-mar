name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Copia de prueba: si existe la rama «prueba», se publica en /prueba/ (lee los datos, no guarda nada)
      - id: prueba
        run: echo "hay=$(git ls-remote --heads origin prueba | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - if: steps.prueba.outputs.hay == '1'
        uses: actions/checkout@v4
        with:
          ref: prueba
          path: rama-prueba
      - if: steps.prueba.outputs.hay == '1'
        working-directory: rama-prueba
        run: npm ci && VITE_PRUEBA=1 npx vite build --outDir ../dist/prueba --emptyOutDir
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
